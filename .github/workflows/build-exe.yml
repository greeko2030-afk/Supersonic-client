name: Build Supersonic Client EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Supersonic Client EXE
    runs-on: windows-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install WinRAR to handle the SFX archive creation
      - name: Install WinRAR
        run: choco install winrar -y

      # Step 3: Create the WinRAR SFX configuration file
      # This tells WinRAR what to run automatically after extraction
      - name: Create WinRAR SFX Config
        shell: powershell
        run: |
          $config = @"
          Path=%TEMP%\Supersonic-Client
          Setup=Supersonic-Ping-Booster.bat
          Silent=1
          Overwrite=1
          "@
          $config | Out-File -FilePath "sfx_config.txt" -Encoding ascii

      # Step 4: Build the final standalone EXE
      # -r: Recursive (includes subdirectories like /mods and /config)
      # -sfx: Creates a Self-Extracting executable
      # -z: Uses our configuration file
      - name: Build Final Standalone EXE
        shell: cmd
        run: |
          "C:\Program Files\WinRAR\WinRAR.exe" a -r -sfx -z"sfx_config.txt" Supersonic-Client-Full.exe Supersonic-Ping-Booster.bat minecraft\

      # Step 5: Upload the result as an Artifact so you can download it
      - name: Upload Supersonic Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-Client-Full
          path: Supersonic-Client-Full.exe
          retention-days: 30
