name: Build Supersonic Client

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Pillow is added here to handle the client's logo image rendering
      - name: Install Dependencies
        run: pip install pyinstaller minecraft-launcher-lib requests customtkinter pillow

      - name: Download and Extract Portable Java 21
        run: |
          Invoke-WebRequest -Uri "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.3%2B9/OpenJDK21U-jre_x64_windows_hotspot_21.0.3_9.zip" -OutFile "jre.zip"
          Expand-Archive -Path "jre.zip" -DestinationPath "jre_extracted"
          Move-Item -Path "jre_extracted\jdk*" -Destination ".\jre21"

      # The logo file 1000084689.png is bundled inside the executable using the --add-data flag
      - name: Build EXE with Bundled Java and Logo
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --add-data "jre21;jre21" --add-data "1000084689.png;." --name "Supersonic-Client-Full" main.py

      # Using standard Windows tools (Chocolatey) to install Inno Setup reliably
      - name: Install Inno Setup
        run: choco install innosetup -y

      # Compile the installer directly using Inno Setup command line
      - name: Compile Inno Setup Installer
        run: iscc setup.iss

      # Upload both the portable client and the installer to GitHub Releases with overwrite enabled
      - name: Automatically Upload to GitHub Releases
        run: |
          gh release create latest --title "Supersonic Client Release" || echo "Release already exists"
          gh release upload latest dist/Supersonic-Client-Full.exe build/Supersonic-Client-Installer.exe --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
