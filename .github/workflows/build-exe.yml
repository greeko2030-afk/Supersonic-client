name: Build Supersonic Client EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Supersonic Client EXE
    runs-on: windows-latest

    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install WinRAR using Chocolatey
      - name: Install WinRAR
        run: choco install winrar -y

      # Step 3: Create the WinRAR SFX configuration file
      - name: Create WinRAR SFX Config
        shell: powershell
        run: |
          $config = @"
          Path=%TEMP%\Supersonic-Client
          Setup=Supersonic-Ping-Booster.bat
          Silent=1
          Overwrite=1
          "@
          $config | Out-File -FilePath "sfx_config.txt" -Encoding ascii

      # Step 4: Build the final standalone EXE with dynamic path detection
      - name: Build Final Standalone EXE
        shell: powershell
        run: |
          # Dynamically locate WinRAR installation path to prevent "path not found" errors
          $winrar = "C:\Program Files\WinRAR\WinRAR.exe"
          if (-not (Test-Path $winrar)) {
              $winrar = "C:\Program Files (x86)\WinRAR\WinRAR.exe"
          }
          if (-not (Test-Path $winrar)) {
              $winrar = "winrar"
          }
          
          # Execute WinRAR safely without trailing slash issues on 'minecraft' folder
          & $winrar a -r -sfx -z"sfx_config.txt" Supersonic-Client-Full.exe Supersonic-Ping-Booster.bat minecraft

      # Step 5: Upload the final compiled EXE as an artifact
      - name: Upload Supersonic Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-Client-Full
          path: Supersonic-Client-Full.exe
          retention-days: 30
