name: Build Supersonic Client EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests customtkinter minecraft-launcher-lib pyinstaller pillow

      - name: Configure CMake for C++ Engine
        run: cmake -B build-engine -S supersonic-engine
        
      - name: Build C++ Engine (opengl32.dll)
        run: cmake --build build-engine --config Release

      # Fix: Creating the correct directory and copying the DLL so PyInstaller finds it
      - name: Prepare Engine Directory
        run: |
          mkdir -p engine
          copy build-engine\Release\opengl32.dll engine\opengl32.dll

      # Fix: Telling PyInstaller the exact correct path to look for the engine data
      - name: Build Python EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "SupersonicClient" --add-data "engine/opengl32.dll;engine" main.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Setup.iss
          options: /O+

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-Client-Installer
          path: Output/Supersonic-Client-Installer.exe
          retention-days: 7
