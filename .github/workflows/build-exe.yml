name: Build Supersonic Client EXE

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests customtkinter minecraft-launcher-lib pyinstaller pillow

      - name: Ensure Engine Directory Exists
        run: |
          mkdir -p engine
        shell: bash

      - name: Build Python EXE (One-Dir for Installer)
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "SupersonicClient" --add-data "engine/opengl32.dll;engine" main.py

      - name: Build Python EXE (One-File for Standalone)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Supersonic-Client" --add-data "engine/opengl32.dll;engine" main.py

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: Setup.iss
          options: /O+

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-Client-Releases
          path: Output/*.exe
          retention-days: 7

      - name: Create GitHub Release and Upload
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Auto Build #${{ github.run_number }}"
          body: "Automated build generated by GitHub Actions with Mesa3D D3D12 translation layer."
          files: Output/*.exe
