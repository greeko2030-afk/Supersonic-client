name: Build Supersonic Client EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-exe:
    name: Build Supersonic Client EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install WinRAR
        run: choco install winrar -y

      - name: Download D3D12 Translator (Mesa3D opengl32.dll)
        run: |
          curl.exe -sL -o mesa3d.7z "https://github.com/pal1000/mesa-dist-win/releases/download/24.0.3/mesa3d-24.0.3-release-msvc.7z"
          7z e mesa3d.7z x64/opengl32.dll -r

      - name: Create WinRAR SFX Config
        shell: powershell
        run: |
          $config = @"
          Path=%TEMP%\Supersonic-Client
          Setup=Supersonic-Ping-Booster.bat
          Silent=1
          Overwrite=1
          "@
          $config | Out-File -FilePath "sfx_config.txt" -Encoding ascii

      - name: Build Final Standalone EXE
        shell: powershell
        run: |
          # Dynamically locate WinRAR installation path
          $winrar = "C:\Program Files\WinRAR\WinRAR.exe"
          if (-not (Test-Path $winrar)) {
              $winrar = "C:\Program Files (x86)\WinRAR\WinRAR.exe"
          }
          if (-not (Test-Path $winrar)) {
              $winrar = "winrar"
          }
          
          # Pack everything including opengl32.dll for Direct3D12 support
          & $winrar a -r -sfx -z"sfx_config.txt" Supersonic-Client-Full.exe Supersonic-Ping-Booster.bat opengl32.dll minecraft

      - name: Upload Supersonic Standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: Supersonic-Client-Full
          path: Supersonic-Client-Full.exe
          retention-days: 30
