name: Build Linux .AppImage

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-appimage:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install customtkinter minecraft-launcher-lib requests pillow psutil pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "supersonic-client" main.py

    - name: Construct AppDir and Build
      run: |
        mkdir -p AppDir/usr/bin
        cp -r dist/supersonic-client/* AppDir/usr/bin/

        cat << 'EOF' > AppDir/AppRun
        #!/bin/sh
        HERE="$(dirname "$(readlink -f "${0}")")"
        exec "${HERE}/usr/bin/supersonic-client" "$@"
        EOF
        chmod +x AppDir/AppRun

        cat << 'EOF' > AppDir/supersonic-client.desktop
        [Desktop Entry]
        Name=Supersonic Client
        Comment=Hyper optimized Minecraft Launcher
        Exec=supersonic-client
        Icon=supersonic-client
        Terminal=false
        Type=Application
        Categories=Game;
        EOF

        # Real icon from the repo (an empty PNG gives a broken icon)
        cp 1000084689.png AppDir/supersonic-client.png
        cp 1000084689.png AppDir/.DirIcon

        # Official appimagetool: it embeds the new type2 runtime, so the resulting
        # AppImage does not depend on libfuse2 being installed on the user's PC.
        wget -O appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
        chmod +x appimagetool
        ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir supersonic-client-linux.AppImage

    - name: Smoke test AppImage (no FUSE needed)
      run: |
        chmod +x supersonic-client-linux.AppImage
        ./supersonic-client-linux.AppImage --appimage-extract > /dev/null
        test -x squashfs-root/AppRun
        test -x squashfs-root/usr/bin/supersonic-client

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: supersonic-client-appimage
        path: supersonic-client-linux.AppImage

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Supersonic Client Latest Build"
        files: supersonic-client-linux.AppImage
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
